name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Установить пакет и зависимости для тестов
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Прогнать тесты
        run: pytest -q

      - name: Проверить, что пакет собирается
        run: |
          python -m build
          python -m twine check dist/*
