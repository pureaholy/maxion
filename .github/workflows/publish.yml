name: publish

# Публикация на PyPI по тегу вида v0.1.0.
#
# Токены нигде не хранятся: используется Trusted Publishing — PyPI доверяет
# именно этому workflow этого репозитория и выдаёт временный ключ на время
# запуска. Настраивается один раз на pypi.org:
#   Your projects -> maxion -> Publishing -> Add a new publisher -> GitHub
#   owner: <твой аккаунт>, repository: maxion,
#   workflow: publish.yml, environment: pypi
#
# До первой публикации проекта на PyPI ещё нет — там же есть форма
# "pending publisher" для нового имени.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Собрать пакет
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # нужно для Trusted Publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Загрузить на PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
